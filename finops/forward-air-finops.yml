principles:
  - name: Visibility
    description: Reconcile Forward Air invoices against shipment manifests and tracking records;
      no public usage API is available.
  - name: Allocation
    description: Tag shipments with cost-center / project codes at booking time for downstream
      chargeback.
  - name: Optimization
    description: Negotiate lane-specific and volume-tier rate cards; consolidate LTL where possible
      to reduce accessorial fees.
  - name: Accountability
    description: Assign a freight-spend owner; review carrier mix and accessorial-fee variance
      monthly.
