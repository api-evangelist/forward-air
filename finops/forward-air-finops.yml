description: Forward Air bills freight services on a contracted-rate basis (LTL, truckload, intermodal,
  brokerage) rather than via a published API/SaaS pricing surface. FinOps treatment focuses on freight
  spend allocation and rate-card optimization.
notes: No public API; FinOps shape inferred from a freight-carrier billing model. Reconcile against
  a customer's master service agreement / rate card when available.
